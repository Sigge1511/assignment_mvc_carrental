name: Deploy Monorepo to Azure

on:
  push:
    branches:
      - clean-main

jobs:
  # SPÅR 1: BYGG OCH DEPLOY FÖR API
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore & Build API
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          dotnet publish --no-build --configuration Release --output ./publish
        working-directory: api-carrental

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Loggar in på ditt ACR direkt via din befintliga Azure-inloggning
      - name: Log in to Azure Container Registry
        run: az acr login --name siggesregister2026

      # Bygger containern utifrån din Dockerfile och taggar den med GitHub-commitens ID
      - name: Build and push Docker image
        run: |
          docker build -f ./api-carrental/Dockerfile -t siggesregister2026.azurecr.io/api-carrental:${{ github.sha }} .
          docker push siggesregister2026.azurecr.io/api-carrental:latest

      # Säger åt api-aca att rulla ut den nya Docker-bilden
      - name: Deploy API to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: siggesregister2026.azurecr.io/api-carrental:latest
          containerAppName: 'api-aca'
          resourceGroup: 'DefaultResourceGroup-NEU'

  # SPÅR 2: BYGG OCH DEPLOY FÖR MVC   
  deploy-mvc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore & Build MVC
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          dotnet publish --no-build --configuration Release --output ../publish_mvc
        working-directory: mvcsource

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy MVC to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'siggesbilar'
          package: './publish_mvc'