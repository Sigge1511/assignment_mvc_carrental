name: Deploy Monorepo to Azure

on:
  push:
    branches:
      - clean-main

jobs:
  # SPÅR 1: BYGG OCH DEPLOY FÖR API
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore & Build API
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          dotnet publish --no-build --configuration Release --output ./publish
        working-directory: api-carrental

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

# Loggar in på ditt ACR
      - name: Log in to Azure Container Registry
        run: az acr login --name siggesregister2026

      # Bygger och pushar med :latest som tagg
      - name: Build and push Docker image
        run: |
          docker build -f ./api-carrental/Dockerfile -t siggesregister2026.azurecr.io/api-carrental:latest .
          docker push siggesregister2026.azurecr.io/api-carrental:latest

# Vi tvingar Azure att uppdatera appen till den senaste "latest"-bilden
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name api-aca \
            --resource-group DefaultResourceGroup-NEU \
            --image siggesregister2026.azurecr.io/api-carrental:latest

  # SPÅR 2: BYGG OCH DEPLOY FÖR MVC   
  deploy-mvc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore & Build MVC
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          dotnet publish --no-build --configuration Release --output ../publish_mvc
        working-directory: mvcsource

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy MVC to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'siggesbilar'
          package: './publish_mvc'